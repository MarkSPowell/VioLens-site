---
layout: default
---
<article class="wrap prose post">
  <p class="post-meta"><a href="{{ '/blog/' | relative_url }}">Blog</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <div class="related">
    <p><a href="{{ '/blog/' | relative_url }}">More posts</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a></p>
  </div>
</article>
